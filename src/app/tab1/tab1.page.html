<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Chat Grupal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list>
    @for (msg of messages; track msg.id) {
      <ion-item [color]="msg.sender_id === currentUserId ? 'light' : ''">
        <ion-icon slot="start" name="person-circle" size="large"></ion-icon>
        <ion-label class="ion-text-wrap">
          <h2><strong>{{ msg.profiles?.display_name || 'Usuario' }}</strong></h2>
          <p>{{ msg.content }}</p>
          <p style="font-size: 0.7rem; color: gray;">{{ msg.created_at | date:'shortTime' }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-item lines="none">
      <ion-input [(ngModel)]="newMessage" placeholder="Escribe un mensaje..." (keyup.enter)="sendMessage()"></ion-input>
      <ion-button fill="clear" (click)="sendMessage()" [disabled]="!newMessage.trim()">
        <ion-icon name="send"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
</ion-footer>
