<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Chat Grupal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list lines="none">
    @for (msg of messages; track msg.id) {
      <ion-item [class.my-message]="msg.sender_id === currentUserId">
        <ion-label class="ion-text-wrap">
          @if (msg.sender_id !== currentUserId) {
            <h2 class="sender-name">{{ msg.profiles?.display_name || 'Usuario' }}</h2>
          }
          <p class="message-text">{{ msg.content }}</p>
          <p class="message-time">{{ msg.created_at | date:'shortTime' }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-item lines="none">
      <ion-input [(ngModel)]="newMessage" placeholder="Escribe un mensaje..." (keyup.enter)="sendMessage()"></ion-input>
      <ion-button fill="clear" (click)="sendMessage()" [disabled]="!newMessage.trim()">
        <ion-icon name="send"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
</ion-footer>
